name: Validate

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  core:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: python -m pip install ".[dev]"
      - run: python -m unittest discover -s tests -v
      - run: python -m unittest research.test_memory_methods research.test_costing research.test_task_audit research.test_simulator_review research.test_memory_study research.test_staleness research.test_memory_csv -v
      - run: ruff check afterevidence tests research scripts
      - run: ruff format --check afterevidence tests research scripts
      - run: pyright
      - run: node --check afterevidence/static/app.js
      - run: python scripts/audit_release.py
      - name: Verify installed web assets
        working-directory: ${{ runner.temp }}
        run: python -c "from importlib.resources import files; assert files('afterevidence').joinpath('static/index.html').is_file()"

  windows-script:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Parse sleep guard without acquiring a power request
        shell: pwsh
        run: |
          $tokens = $null
          $errors = $null
          [System.Management.Automation.Language.Parser]::ParseFile(
            (Join-Path $env:GITHUB_WORKSPACE 'scripts\keep-awake.ps1'),
            [ref]$tokens, [ref]$errors
          ) | Out-Null
          if ($errors.Count -gt 0) { throw ($errors | Out-String) }
