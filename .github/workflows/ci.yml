name: Validate

on:
  push:
  pull_request:
  schedule:
    - cron: "17 6 * * 1" # weekly: also run the slow research dry passes
  workflow_dispatch:

permissions:
  contents: read

jobs:
  core:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python }}
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
      - run: python -m pip install ".[dev]" pydantic==2.14.3 # pydantic: research harness logic tests
      - run: python -m unittest discover -s tests -v
      # Every published number from the public CSVs, plus research tests that need no benchmark;
      # tests that need the pinned benchmark or SDK skip themselves here and run in `research`.
      - run: python -m unittest discover -s research/tests -t . -v
      - run: ruff check afterevidence tests research scripts
      - run: ruff format --check afterevidence tests research scripts
      - run: pyright
      - run: node --check afterevidence/static/app.js
      - run: python scripts/audit_release.py
      - name: Verify installed web assets
        working-directory: ${{ runner.temp }}
        run: python -c "from importlib.resources import files; assert files('afterevidence').joinpath('static/index.html').is_file()"

  research:
    runs-on: ubuntu-latest
    timeout-minutes: 150
    env:
      AFTEREVIDENCE_SLOW: ${{ (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch') && '1' || '0' }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Check out the pinned benchmark and Copilot SDK
        run: |
          lock=research/locks/benchmark-lock.json
          pin() { python -c "import json, sys; print(json.load(open('$lock'))[sys.argv[1]])" "$1"; }
          fetch() {
            git init -q "$1"
            git -C "$1" fetch -q --depth 1 "$2" "$3"
            git -C "$1" checkout -q FETCH_HEAD
          }
          fetch research/vendor/tau2-bench "$(pin repository)" "$(pin commit)"
          fetch research/vendor/copilot-sdk "$(pin copilot_sdk_repository)" "$(pin copilot_sdk_commit)"
      - name: Install the pinned research dependencies
        working-directory: research
        run: python -m pip install -r requirements.txt -c locks/dependencies.lock.txt
      - run: python -m pip install ".[dev]"
      - run: python -m unittest discover -s research/tests -t . -v
      - run: pyright --project research/pyrightconfig.json --pythonpath "$(which python)"

  windows-script:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - name: Parse the sleep guard, worktree helper and run driver without running them
        shell: pwsh
        run: |
          foreach ($script in 'keep-awake.ps1', 'frozen-worktree.ps1', 'run-eval.ps1') {
            $tokens = $null
            $errors = $null
            [System.Management.Automation.Language.Parser]::ParseFile(
              (Join-Path $env:GITHUB_WORKSPACE ('scripts\' + $script)),
              [ref]$tokens, [ref]$errors
            ) | Out-Null
            if ($errors.Count -gt 0) { throw ($script + ': ' + ($errors | Out-String)) }
          }
